<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KENCANA RABIES</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Arial,sans-serif;

background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url("./assets/Ikon%20labuan.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

#opening{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
z-index:9999;
display:flex;
justify-content:center;
align-items:center;
}

#opening img{
width:100%;
height:100%;
object-fit:contain;
}

.kotak{

text-align:center;

animation:fade 1.5s;

}

.logo{

width:180px;

border-radius:50%;

box-shadow:0 0 25px rgba(255,255,255,.5);

}

h1{

color:#FFD700;

font-size:55px;

margin:20px;

}

button{

padding:18px 55px;

font-size:26px;

background:#FFD700;

border:none;

border-radius:40px;

cursor:pointer;

font-weight:bold;

transition:.3s;

}

button:hover{

transform:scale(1.08);

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>

<div id="opening">
    <img src="./assets/Opening%20Kencana.jpeg" alt="KENCANA RABIES">
</div>

<div class="kotak" id="home" style="display:none;">
<img src="assets/logo-kencana.jpeg" class="logo" alt="Logo RABIES KENCANA">

<h1>KENCANA RABIES</h1>

<button onclick="window.location.href='menu.html'">
MULAI
</button>

</div>

<script>
const opening = document.getElementById("opening");
const home = document.getElementById("home");

setTimeout(function () {
    opening.style.display = "none";
    home.style.display = "block";
}, 3000);
</script>

</body>
</html>
