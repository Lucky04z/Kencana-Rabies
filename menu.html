<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KENCANA RABIES</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url("./assets/Ikon%20labuan.jpg");
background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
text-align:center;
min-height:100vh;
}

.header{
padding:35px 20px 15px;
animation:muncul 1s ease;
}

.logo{
width:150px;
border-radius:50%;
box-shadow:0 0 30px rgba(255,255,255,.4);
margin-bottom:15px;
}

h1{
color:#FFD54F;
font-size:42px;
margin-bottom:10px;
text-shadow:0 2px 8px rgba(0,0,0,.5);
}

.menu{
width:90%;
max-width:720px;
margin:auto;
padding-bottom:40px;
animation:muncul 1.3s ease;
}

.menu a{
display:block;
padding:22px;
margin:18px 0;
border-radius:22px;
text-decoration:none;
font-size:22px;
font-weight:bold;
color:white;

background:rgba(255,255,255,.16);
border:1px solid rgba(255,255,255,.25);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);

box-shadow:0 8px 25px rgba(0,0,0,.35);

transition:all .35s ease;
}

.menu a:hover{

transform:translateY(-5px) scale(1.03);

background:rgba(255,255,255,.28);

box-shadow:0 18px 35px rgba(0,0,0,.45);

}

.footer{
padding:30px;
font-size:15px;
opacity:.9;
}

@keyframes muncul{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media(max-width:700px){

.logo{
width:120px;
}

h1{
font-size:32px;
}

.menu a{
font-size:18px;
padding:18px;
}

}
</style>

</head>
